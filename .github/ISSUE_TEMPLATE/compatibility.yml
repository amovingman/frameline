name: Editor compatibility report
description: Report a reproducible FCPXML or Resolve compatibility problem without sharing media.
title: "Compatibility: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: "Please do not attach private project files, media, credentials, or local paths."
  - type: input
    id: editor
    attributes:
      label: Editor edition and exact build
      placeholder: "DaVinci Resolve Free 21.1.2, build ..."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Export format
      options: ["FCPXML 1.10 file", "FCPXML bundle", "Other"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce with disposable content
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed diagnostic fields (optional)
      description: Include only fields you have inspected and chosen to share.
