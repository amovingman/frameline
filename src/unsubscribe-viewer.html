<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="frameline-api-version" content="__API_VERSION__">
  <title>Email notifications · Frameline</title>
  <script src="/unsubscribe/viewer.js"></script>
  <link rel="stylesheet" href="/share/viewer.css">
</head>
<body>
  <header class="page brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><strong>Frameline</strong><span>Email preferences</span></header>
  <main class="page">
    <section class="opening" aria-labelledby="page-title">
      <h1 id="page-title">Email notifications</h1>
      <p>Turn off notification email for the project linked to this email.</p>
      <button id="unsubscribe" type="button" disabled>Turn off email</button>
      <p id="unsubscribe-status" role="status" aria-live="polite">Checking the link in this tab…</p>
      <noscript><p>JavaScript is required to submit this preference. The link is never submitted automatically.</p></noscript>
    </section>
  </main>
</body>
</html>
